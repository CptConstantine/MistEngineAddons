name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release manifest
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: node scripts/validate-manifest.js

      - name: Package module
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          zip -r "mist-engine-addons-v${RELEASE_VERSION}.zip" \
            module.json \
            scripts \
            styles \
            lang \
            README.md \
            LICENSE

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            mist-engine-addons-v${{ steps.release_version.outputs.version }}.zip