name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set release version
        id: release_version
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Release tag must use the vX.Y.Z format." >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          npm run check
          npm test
          npm run validate:manifest

      - name: Package module
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          zip -r "mist-engine-addons-v${RELEASE_VERSION}.zip" \
            module.json \
            scripts \
            styles \
            lang \
            README.md \
            LICENSE

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            module.json
            mist-engine-addons-v${{ steps.release_version.outputs.version }}.zip